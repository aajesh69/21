<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery | 21 Coffee House</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="aboutus.html">About Us</a>
      <a href="menu.html">Menu</a>
      <a href="gallery.html">Gallery</a>
      <a href="services.html">Services</a>
      <a href="location.html">Location</a>
    </nav>
  </header>

  <main class="section">
    <h2>Gallery</h2>
    <div class="gallery">
      <img src="images/cafe1.jpg" alt="Cafe Interior">
      <img src="images/cafe2.jpg" alt="Barista at Work">
      <img src="images/cafe3.jpg" alt="Delicious Pastries">
    </div>
  </main>
  <div class="sub-footer">
    <div class="sub-footer-content">
      <div>
        <h4>Contact Us</h4>
        <p>📞 +977 9800000000</p>
        <p>✉️ contact@21coffeehouse.com</p><br>
        <div class="social-icons">
          <a href="https://www.facebook.com/twentyonecoffeehouse/" target="_blank"><i class="fab fa-facebook-f"></i></a>
          <a href="https://www.instagram.com/21coffeehousekamalpokhari/" target="_blank"><i class="fab fa-instagram"></i></a>
        </div>
      </div>
      <div>
        <h4>Visit Us</h4>
        <p>📍 Nagpokhari, Kathmandu</p>
        <p>📍 Kamalpokhari, Kathmandu</p>
        <p>📍 Maharajgunj, Kathmandu</p>
        <p>📍 Baudha, Kathmandu</p>
      </div>
     
    </div>
  </div>

  <footer>
    <p>&copy; 2025 21 Coffee House and Bar. All Rights Reserved.</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const navLinks = document.querySelectorAll(".navbar a");
      const currentPage = window.location.pathname.split("/").pop() || "index.html";

      navLinks.forEach(link => {
        const linkPage = link.getAttribute("href");
        if (linkPage === currentPage) {
          link.classList.add("active");
        }
      });
    });
  </script>
</body>
</html>
